name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Public workspace to publish
        required: true
        type: choice
        options:
          - packages/hello-pi
          - packages/custom-provider
          - packages/doctor
          - packages/worktree
          - packages/git
          - packages/biome
          - packages/token-speed
          - packages/session-usage
          - packages/session-stats
          - packages/session-delete
          - packages/compact-tools
          - packages/auto-title
          - packages/onboarding
          - apps/installer

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.workspace }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run check

      - name: Publish package with provenance
        run: npm publish --workspace "${{ inputs.workspace }}" --access public --provenance
